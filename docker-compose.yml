# Optional local PostgreSQL. The API still starts if the database is down.
# From the project root: docker compose up -d

services:
  db:
    image: postgres:16
    container_name: ai-finance-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_finance
    ports:
      - "5432:5432"
    volumes:
      - ai_finance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_finance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_finance_pgdata:
